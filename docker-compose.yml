version: "3.9"

services:
  camfart:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Dev-only SQL Server ───────────────────────────────────────────────────
  # Start with: docker compose --profile dev up
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    profiles: ["dev"]
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-DevPassword1!}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd",
             "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD:-DevPassword1!}",
             "-Q", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sqlserver_data:
